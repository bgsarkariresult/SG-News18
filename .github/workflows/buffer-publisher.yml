name: SG News18 Reel → Buffer

on:
  workflow_run:
    workflows: ["SG News18 - Reels Maker"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: sg-news18-buffer-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  send-reel-to-buffer:
    # Never send a failed/partial render to Buffer.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Buffer API secret before doing any publishing work
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "${BUFFER_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing BUFFER_ACCESS_TOKEN. Add it under repository Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Download the exact Reel artifact from the completed run
        uses: actions/download-artifact@v4
        with:
          name: reel
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: reel_outputs

      - name: Verify Reel file exists
        id: reel
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t videos < <(find reel_outputs -type f -iname '*.mp4' -print)
          if [ "${#videos[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one MP4 in the upstream 'reel' artifact; found ${#videos[@]}."
            find reel_outputs -maxdepth 3 -type f -print || true
            exit 1
          fi
          video="${videos[0]}"
          filename="$(basename "$video")"
          echo "video=$video" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "Using the exact Reel generated by run ${{ github.event.workflow_run.id }}: $filename"
          test -s "$video"

      - name: Publish MP4 as a public GitHub Release asset
        id: host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO: ${{ steps.reel.outputs.video }}
          FILENAME: ${{ steps.reel.outputs.filename }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="sg-news18-reel-${SOURCE_RUN_ID}"
          # A public release asset gives Buffer a URL it can fetch without GitHub authentication.
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            # Safe to retry: replace the same run's asset rather than failing on an existing tag.
            gh release upload "$tag" "$VIDEO" --repo "$REPOSITORY" --clobber
          else
            gh release create "$tag" "$VIDEO" \
              --repo "$REPOSITORY" \
              --title "SG News18 Reel ${SOURCE_RUN_ID}" \
              --notes "Automatically hosted Reel from successful SG News18 - Reels Maker run ${SOURCE_RUN_ID}."
          fi
          asset_url="https://github.com/${REPOSITORY}/releases/download/${tag}/${FILENAME}"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "Hosted Reel asset: $asset_url"

      - name: Add the same Reel to connected Buffer Instagram and Facebook queues
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.host.outputs.asset_url }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BUFFER_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing BUFFER_ACCESS_TOKEN. Add it under repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          TOKEN = os.environ["BUFFER_ACCESS_TOKEN"]
          VIDEO_URL = os.environ["VIDEO_URL"]
          RUN_ID = os.environ["SOURCE_RUN_ID"]
          ENDPOINT = "https://api.buffer.com"

          def gql(query, variables=None):
              payload = {"query": query}
              if variables is not None:
                  payload["variables"] = variables
              req = urllib.request.Request(
                  ENDPOINT,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=40) as response:
                      data = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"Buffer API HTTP {exc.code}: {body[:1000]}") from exc
              if data.get("errors"):
                  raise RuntimeError("Buffer GraphQL error: " + json.dumps(data["errors"])[:1500])
              return data.get("data", {})

          org_data = gql("""
            query GetOrganizations {
              account {
                organizations { id name }
              }
            }
          """)
          organizations = (org_data.get("account") or {}).get("organizations") or []
          if not organizations:
              raise RuntimeError("No Buffer organization found for this API token.")

          # Use the first organization, matching the standard Buffer account setup.
          organization = organizations[0]
          org_id = organization["id"]
          print(f"Buffer organization selected: {organization.get('name', org_id)}")

          channel_data = gql("""
            query GetChannels($organizationId: OrganizationId!) {
              channels(input: { organizationId: $organizationId }) {
                id
                name
                displayName
                service
              }
            }
          """, {"organizationId": org_id})
          channels = channel_data.get("channels") or []
          targets = [
              channel for channel in channels
              if str(channel.get("service", "")).lower() in ("instagram", "facebook")
          ]
          if not targets:
              available = [
                  f"{c.get('displayName') or c.get('name')} ({c.get('service')})"
                  for c in channels
              ]
              raise RuntimeError(
                  "No Instagram/Facebook channels found in the first Buffer organization. "
                  "Connected channels: " + (", ".join(available) or "none")
              )

          mutation = """
            mutation CreateReelPost($input: CreatePostInput!) {
              createPost(input: $input) {
                ... on PostActionSuccess {
                  post { id text dueAt }
                }
                ... on MutationError {
                  message
                }
              }
            }
          """
          caption = (
              "SG News18 की ताज़ा खबरें देखें।\n\n"
              "#SGNews18 #HindiNews #NewsReels #Shorts"
          )
          successes = []
          failures = []
          for channel in targets:
              service = str(channel.get("service", "")).lower()
              metadata = {}
              if service == "instagram":
                  metadata = {"instagram": {"type": "reel", "shouldShareToFeed": True}}
              elif service == "facebook":
                  metadata = {"facebook": {"type": "reel"}}

              post_input = {
                  "channelId": channel["id"],
                  "text": caption,
                  "mode": "addToQueue",
                  "schedulingType": "automatic",
                  "assets": [{"video": {"url": VIDEO_URL}}],
              }
              if metadata:
                  post_input["metadata"] = metadata

              try:
                  result = gql(mutation, {"input": post_input}).get("createPost") or {}
                  post = result.get("post")
                  if not post:
                      raise RuntimeError(result.get("message") or json.dumps(result))
                  successes.append((channel.get("displayName") or channel.get("name") or service, post))
                  print(
                      f"Queued on {channel.get('displayName') or channel.get('name')}: "
                      f"post={post.get('id')} dueAt={post.get('dueAt')}"
                  )
              except Exception as exc:
                  failures.append(f"{channel.get('displayName') or channel.get('name')}: {exc}")

          print(f"Upstream Reel run: {RUN_ID}")
          print(f"Successfully queued: {len(successes)}; failed: {len(failures)}")
          if failures:
              for failure in failures:
                  print("::error::" + failure)
          if not successes or failures:
              sys.exit(1)
          PY
