name: SG News18 - Auto Video Bot

on:
  # OPTION 1: GitHub Actions page se manually URL daal kar run karo
  workflow_dispatch:
    inputs:
      article_url:
        description: "GitHub Pages Article URL"
        required: false
        type: string

  # OPTION 2: Har 5 min me khud check karta hai ki Telegram bot pe naya link aaya kya
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  resolve-url:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.get_url.outputs.article_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Manual URL (workflow_dispatch se)
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "url=${{ inputs.article_url }}" >> "$GITHUB_OUTPUT"

      - name: Python setup (Telegram check ke liye)
        if: github.event_name == 'schedule'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Telegram se naya link check karo
        if: github.event_name == 'schedule'
        id: get_url
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests
          python telegram_check.py

      - name: Manual run ka output final karo
        if: github.event_name == 'workflow_dispatch'
        run: echo "article_url=${{ inputs.article_url }}" >> "$GITHUB_OUTPUT"
        id: get_url_manual

      - name: Offset file commit karo (agar Telegram check chala ho)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add .telegram_offset || true
          git diff --cached --quiet || git commit -m "chore: update telegram offset [skip ci]"
          git push || true

  run-automation:
    needs: resolve-url
    if: needs.resolve-url.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python deps install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: YouTube credentials taiyaar karo (secrets se, seedha JSON paste kiya hua)
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.YT_CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRETS_JSON" > client_secrets.json
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Video banao aur YouTube pe upload karo
        env:
          ARTICLE_URL: ${{ needs.resolve-url.outputs.url }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL_NAME: "gemini-3.6-flash"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py
