name: SG News18 - Reels Maker

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "News article link (jaise https://bgnewswab.github.io/sgnewswab/article.html?id=112)"
        required: true

permissions:
  contents: write   # Buffer ke liye reel GitHub Release par upload hoti hai

jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages (ffmpeg + Hindi font + text shaping)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg fonts-noto-core libraqm0

      - name: Python packages
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: YouTube credentials (secrets se, seedha JSON paste kiya hua)
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.YT_CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRETS_JSON" > client_secrets.json
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Make reel
        env:
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL_NAME: gemini-3.6-flash
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_SERVICES: "instagram,facebook"
        run: python reels_maker.py

      - name: Save reel (download ke liye)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reel_outputs/*.mp4
          if-no-files-found: ignore
